apiVersion: 1
groups:
  - orgId: 1
    name: notes-alamin-latency
    folder: notes_alamin
    interval: 1m
    rules:
      - uid: p95-high-alamin
        title: p95 latency high (alamin)
        condition: C
        for: 2m
        annotations:
          summary: 'p95 > 5s on {{ $labels.route }}'
        labels:
          severity: warning
          student: alamin
        noDataState: NoData
        execErrState: Error
        data:
          # A = Prometheus theke p95, route wise
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PROM
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route))
          # B = protita route er sesh value ta nao
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          # C = 5 second er upore kina — eitai alert er condition
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
