# /etc/nginx/conf.d/myapp_alamin.conf
# EXAM TOKEN: alamin-vmi3536696-1788528499-d41f1787
#

# ek IP second e 5 ta request pabe
limit_req_zone $binary_remote_addr zone=api_alamin:10m rate=5r/s;

upstream backend_alamin {
    # least_conn;      # task 17 e on kore test korechi
    # ip_hash;         # task 17 e on kore test korechi

    # max_fails=3 -> 3 bar fail hole backend baad
    # fail_timeout=10s -> 10 second por abar cheshta korbe
    server 127.0.0.1:30101 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:30102 max_fails=3 fail_timeout=10s;
}

server {
    listen 30180;
    server_name _;

    access_log /var/log/nginx/myapp_alamin_access.log;
    error_log  /var/log/nginx/myapp_alamin_error.log;

    location / {
        proxy_pass http://backend_alamin;

        # ei 4 line na dile app mone kore sob request 127.0.0.1 theke asche
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # task 19: age 5s chilo tai /slow e 504 asto (45 second lage endpoint tar).
    # 60s kore dewar por 200 ashe.
    location /slow {
        proxy_pass http://backend_alamin;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_send_timeout    5s;
        proxy_read_timeout    60s;
    }

    # task 20: burst=5 mane hothat 5 ta extra jomate parbe,
    # nodelay mane oi 5 ta sathe sathe pass korbe, baki gulo 429
    location /api/notes {
        limit_req zone=api_alamin burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_alamin;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
