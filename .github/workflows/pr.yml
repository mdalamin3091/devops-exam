# Md. Al amin - PR pipeline: test -> build -> prove the image actually runs
name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: 1) Check out code
        uses: actions/checkout@v4

      - name: 2) Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scenario-b/app/package-lock.json

      - name: 3) Install dependencies
        working-directory: scenario-b/app
        run: npm ci

      - name: 4) Unit tests (4 of them)
        working-directory: scenario-b/app
        run: npm test

      - name: 5a) Set up Buildx (required for the gha cache)
        uses: docker/setup-buildx-action@v3

      - name: 5b) Build image (with layer cache)
        uses: docker/build-push-action@v6
        with:
          context: scenario-b/app
          file: scenario-b/docker/Dockerfile
          tags: notes-api:pr-${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6) Prove the image runs - postgres + app + curl
        run: |
          set -euo pipefail

          docker network create ci_net_alamin

          docker run -d --name ci_pg --network ci_net_alamin \
            -e POSTGRES_USER=notes \
            -e POSTGRES_PASSWORD=ci_only_not_a_real_secret \
            -e POSTGRES_DB=notesdb \
            postgres:16-alpine

          echo "waiting for postgres to become ready..."
          for i in $(seq 1 30); do
            docker exec ci_pg pg_isready -U notes -d notesdb >/dev/null 2>&1 && break
            sleep 2
          done

          docker run -d --name ci_app --network ci_net_alamin -p 3000:3000 \
            -e PGHOST=ci_pg \
            -e PGUSER=notes \
            -e PGPASSWORD=ci_only_not_a_real_secret \
            -e PGDATABASE=notesdb \
            notes-api:pr-${{ github.sha }}

          echo "waiting for /healthz..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then
              echo ""
              echo "image runs and is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "app never became healthy - container logs:"
          docker logs ci_app
          exit 1

      - name: 7) Clean up (runs even on failure)
        if: always()
        run: |
          docker rm -f ci_app ci_pg >/dev/null 2>&1 || true
          docker network rm ci_net_alamin >/dev/null 2>&1 || true
